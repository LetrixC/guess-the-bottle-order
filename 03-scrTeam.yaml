- btnStartDuo:
    Control: Classic/Button
    Properties:
      Text: ="SAME DEVICE ▶"
      DisplayMode: |-
        =If(
            IsBlank(cmbMate.Selected) || cmbMate.Selected.Mail = User().Email,
            DisplayMode.Disabled,
            DisplayMode.Edit
        )
      OnSelect: |-
        =Set(gMode, "DUO");
        Set(gP2, {Name: cmbMate.Selected.DisplayName, Email: cmbMate.Selected.Mail});
        Set(
            gTeam,
            If(
                IsBlank(Trim(txtTeamName.Text)),
                First(Split(gP1.Name, " ")).Value & " + " & First(Split(gP2.Name, " ")).Value,
                Trim(txtTeamName.Text)
            )
        );
        Navigate(scrGame, ScreenTransition.Fade)
      Font: =Font.'Courier New'
      FontWeight: =FontWeight.Bold
      Size: =20
      Fill: =C_White
      Color: =C_Black
      HoverFill: =C_Gold
      HoverColor: =C_Black
      PressedFill: =C_Blue
      PressedColor: =C_White
      DisabledFill: =C_Dim
      DisabledColor: =C_BlueLt
      DisabledBorderColor: =C_Black
      BorderColor: =C_Black
      BorderThickness: =4
      RadiusTopLeft: =0
      RadiusTopRight: =0
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      X: =584
      Y: =630
      Width: =340
