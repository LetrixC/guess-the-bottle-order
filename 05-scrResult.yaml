# ---------------- shareable result card (shows Teams account names) ----------------
- imgCard:
    Control: Image
    Properties:
      ImagePosition: =ImagePosition.Fit
      Image: |-
        =With(
            {
                n1: Substitute(Substitute(Substitute(Left(gP1.Name, 26), "&", "&amp;"), "<", "&lt;"), ">", "&gt;"),
                n2: Substitute(Substitute(Substitute(Left(gP2.Name, 26), "&", "&amp;"), "<", "&lt;"), ">", "&gt;"),
                tm: Substitute(Substitute(Substitute(Upper(Left(gTeam, 26)), "&", "&amp;"), "<", "&lt;"), ">", "&gt;"),
                t: CountRows(colHistory),
                g1: CountRows(Filter(colHistory, Seat = 1)),
                g2: CountRows(Filter(colHistory, Seat = 2)),
                f: "font-family='Courier New,monospace' font-weight='bold'"
            },
            SvgHead & EncodeUrl(
                "<svg xmlns='http://www.w3.org/2000/svg' width='720' height='450' viewBox='0 0 720 450'>" &
                "<rect width='720' height='450' fill='#050505'/>" &
                "<rect x='12' y='12' width='696' height='426' fill='#0B1440' stroke='#1E4DFF' stroke-width='8'/>" &
                "<g transform='translate(28,22) scale(0.34)'>" & NineDotsRects & "</g>" &
                "<text x='110' y='62' " & f & " font-size='18' fill='#7A95FF'>GUESS THE BOTTLE ORDER</text>" &
                "<text x='36' y='132' " & f & " font-size='46' fill='" & If(gWin, "#FFD60A", "#FFFFFF") & "'>" &
                    If(gWin, "CODE CRACKED!", "GAME OVER") & "</text>" &
                "<text x='36' y='176' " & f & " font-size='24' fill='#FFFFFF'>" &
                    If(gWin, "IN " & t & " TURN" & If(t = 1, "", "S") & " / " & MaxTurns, "USED ALL " & MaxTurns & " TURNS") & "</text>" &
                If(
                    gMode <> "SOLO",
                    "<text x='36' y='236' " & f & " font-size='16' fill='#7A95FF'>TEAM</text>" &
                    "<text x='36' y='264' " & f & " font-size='24' fill='#FFFFFF'>" & tm & "</text>" &
                    "<text x='36' y='310' " & f & " font-size='17' fill='#FFFFFF'>P1 " & n1 & "</text>" &
                    "<text x='36' y='332' " & f & " font-size='14' fill='#7A95FF'>   " & g1 & " GUESS" & If(g1 = 1, "", "ES") & "</text>" &
                    "<text x='36' y='364' " & f & " font-size='17' fill='#FFFFFF'>P2 " & n2 & "</text>" &
                    "<text x='36' y='386' " & f & " font-size='14' fill='#7A95FF'>   " & g2 & " GUESS" & If(g2 = 1, "", "ES") & "</text>",
                    "<text x='36' y='236' " & f & " font-size='16' fill='#7A95FF'>PLAYER</text>" &
                    "<text x='36' y='266' " & f & " font-size='24' fill='#FFFFFF'>" & n1 & "</text>"
                ) &
                "<text x='450' y='222' " & f & " font-size='16' fill='#7A95FF'>SECRET CODE</text>" &
                Concat(
                    Table({p: 1, c: gC1}, {p: 2, c: gC2}, {p: 3, c: gC3}, {p: 4, c: gC4}),
                    "<g transform='translate(" & (450 + (p - 1) * 60) & ",236) scale(4)' shape-rendering='crispEdges'>" &
                    Substitute(BottleRects, "#FILL", LookUp(Bottles, Id = c).Hex) & "</g>"
                ) &
                "<text x='36' y='418' " & f & " font-size='14' fill='#7A95FF'>" & Text(Now(), "yyyy-mm-dd") &
                    " · CAN YOU BEAT " & If(gMode <> "SOLO", "US", "ME") & "?</text>" &
                "</svg>"
            )
        )
      X: =56
      Y: =166
      Width: =780
      Height: =488
