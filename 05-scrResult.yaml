# ---------------- sharing ----------------
- lblShareMsg:
    Control: Label
    Properties:
      Visible: =false
      Text: |-
        ="GUESS THE BOTTLE ORDER · 9 DOTS CONSULTING" & Char(10) &
        If(gMode <> "SOLO", "Team " & gTeam & " (" & gP1.Name & " + " & gP2.Name & ")", gP1.Name) &
        If(
            gWin,
            " cracked the secret bottle order in " & CountRows(colHistory) & " turn(s)!",
            " couldn't crack the code in " & MaxTurns & " turns... the bottles win this round."
        ) &
        Char(10) & "Think you can beat that? Play here: " & AppPlayLink
      X: =872
      Y: =700
      Width: =10
      Height: =10
