                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            OnSelect: |-
              =Set(gMode, "ONLINE");
              Set(gMySeat, 1);
              Set(gP2, {Name: cmbMate.Selected.DisplayName, Email: cmbMate.Selected.Mail});
              Set(
                  gTeam,
                  If(
                      IsBlank(Trim(txtTeamName.Text)),
                      First(Split(gP1.Name, " ")).Value & " + " & First(Split(gP2.Name, " ")).Value,
                      Trim(txtTeamName.Text)
                  )
              );
              Set(
                  gGame,
                  Patch(
                      BottleGames,
                      Defaults(BottleGames),
                      {
                          RoomCode: Concat(Sequence(4), Mid("ABCDEFGHJKLMNPQRSTUVWXYZ23456789", RandBetween(1, 32), 1)),
                          HostName: gP1.Name,
                          HostEmail: gP1.Email,
                          GuestName: gP2.Name,
                          GuestEmail: gP2.Email,
                          TeamName: gTeam,
                          Secret: Concat(FirstN(Shuffle(Bottles), 4), Text(Id), ","),
                          Status: "WAITING",
                          Turn: 1,
                          Seat: 1,
                          Guesses: ""
                      }
                  )
              );
              Navigate(scrLobby, ScreenTransition.Fade)
