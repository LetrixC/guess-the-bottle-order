              =If(
                  locS1 = 0 || locS2 = 0 || locS3 = 0 || locS4 = 0 || (gMode = "ONLINE" && gSeat <> gMySeat),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            OnSelect: |-
              =With(
                  {
                      p: If(locS1 = gC1, 1, 0) + If(locS2 = gC2, 1, 0) + If(locS3 = gC3, 1, 0) + If(locS4 = gC4, 1, 0),
                      hits: CountIf([locS1, locS2, locS3, locS4], Value = gC1 || Value = gC2 || Value = gC3 || Value = gC4)
                  },
                  If(
                      gMode = "ONLINE",
                          Set(
                              gGame,
                              Patch(
                                  BottleGames,
                                  LookUp(BottleGames, ID = gGame.ID),
                                  {
                                      Guesses: gGame.Guesses & gTurn & "|" & gSeat & "|" & locS1 & "|" & locS2 & "|" &
                                          locS3 & "|" & locS4 & "|" & p & "|" & (hits - p) & ";",
                                      Turn: If(p = 4 || gTurn >= MaxTurns, gTurn, gTurn + 1),
                                      Seat: If(p = 4 || gTurn >= MaxTurns, gSeat, If(gSeat = 1, 2, 1)),
                                      Status: If(p = 4, "WON", gTurn >= MaxTurns, "LOST", "PLAYING")
                                  }
                              )
                          );
                          UpdateContext({locS1: 0, locS2: 0, locS3: 0, locS4: 0});
                          Select(btnApplySync),
                      Collect(
                          colHistory,
                          {
                              Turn: gTurn,
                              Seat: gSeat,
                              Player: If(gSeat = 1, gP1.Name, gP2.Name),
                              S1: locS1, S2: locS2, S3: locS3, S4: locS4,
                              Perfect: p,
                              Misplaced: hits - p
                          }
                      );
                      UpdateContext({locS1: 0, locS2: 0, locS3: 0, locS4: 0});
                      If(
                          p = 4,
                              Set(gWin, true); Navigate(scrResult, ScreenTransition.Cover),
                          gTurn >= MaxTurns,
                              Set(gWin, false); Navigate(scrResult, ScreenTransition.Cover),
                          Set(gTurn, gTurn + 1);
                          If(gMode = "DUO", Set(gSeat, If(gSeat = 1, 2, 1)); UpdateContext({locHandoff: true}))
                      )
                  )
              )
