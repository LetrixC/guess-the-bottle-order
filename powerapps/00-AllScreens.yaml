      - btnApplySync:
          Control: Classic/Button
          Properties:
            Text: ="sync"
            Visible: =false
            OnSelect: |-
              =ClearCollect(
                  colHistory,
                  ForAll(
                      Filter(Split(gGame.Guesses, ";"), !IsBlank(Value)) As g,
                      With(
                          {f: Split(g.Value, "|")},
                          {
                              Turn: Value(Index(f, 1).Value),
                              Seat: Value(Index(f, 2).Value),
                              Player: If(Value(Index(f, 2).Value) = 1, gP1.Name, gP2.Name),
                              S1: Value(Index(f, 3).Value),
                              S2: Value(Index(f, 4).Value),
                              S3: Value(Index(f, 5).Value),
                              S4: Value(Index(f, 6).Value),
                              Perfect: Value(Index(f, 7).Value),
                              Misplaced: Value(Index(f, 8).Value)
                          }
                      )
                  )
              );
              Set(gTurn, gGame.Turn);
              Set(gSeat, gGame.Seat);
              If(
                  gGame.Status = "WON",
                      Set(gWin, true); Navigate(scrResult, ScreenTransition.Cover),
                  gGame.Status = "LOST",
                      Set(gWin, false); Navigate(scrResult, ScreenTransition.Cover),
                  gGame.Status = "QUIT",
                      Notify("YOUR TEAMMATE LEFT THE GAME", NotificationType.Warning);
                      Navigate(scrHome, ScreenTransition.Fade)
              )
            X: =0
            Y: =0
            Width: =10
            Height: =10
