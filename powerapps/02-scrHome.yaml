- lblHow:
    Control: Label
    Properties:
      Text: |-
        ="1. THE SYSTEM HIDES 4 BOTTLES
           (6 COLOURS, NO REPEATS)
        2. ARRANGE YOUR 4 BOTTLES
        3. PRESS CONFIRM
        4. READ THE CLUES:
           ● PERFECT = RIGHT COLOUR,
                       RIGHT SPOT
           ○ COLOUR  = RIGHT COLOUR,
                       WRONG SPOT
        5. DEDUCE, SWAP, REPEAT
        6. HIT ●●●● IN 10 TURNS TO WIN"
      Font: =Font.'Courier New'
      FontWeight: =FontWeight.Bold
      Size: =13
      Color: =C_White
      Fill: =C_Navy
      BorderStyle: =BorderStyle.Solid
      BorderThickness: =4
