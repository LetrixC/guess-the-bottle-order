- btnJoinCode:
    Control: Classic/Button
    Properties:
      Text: ="JOIN ▶"
      Visible: =gMySeat = 2
      DisplayMode: =If(Len(Trim(txtRoom.Text)) = 4, DisplayMode.Edit, DisplayMode.Disabled)
      OnSelect: |-
        =Refresh(BottleGames);
        UpdateContext({locJoin: LookUp(BottleGames, RoomCode = Upper(Trim(txtRoom.Text)) && Status = "WAITING")});
        If(
            IsBlank(locJoin),
            Notify("ROOM NOT FOUND, OR THE GAME ALREADY STARTED", NotificationType.Error),
            Select(btnDoJoin)
        )
      Font: =Font.'Courier New'
      FontWeight: =FontWeight.Bold
      Size: =20
      Fill: =C_White
      Color: =C_Black
      HoverFill: =C_Gold
      HoverColor: =C_Black
      PressedFill: =C_Blue
      PressedColor: =C_White
      DisabledFill: =C_Dim
      DisabledColor: =C_BlueLt
      DisabledBorderColor: =C_Black
      BorderColor: =C_Black
      BorderThickness: =4
      RadiusTopLeft: =0
      RadiusTopRight: =0
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      X: =420
      Y: =460
      Width: =320
      Height: =70
- btnDoJoin:
    Control: Classic/Button
    Properties:
      Text: ="join"
      Visible: =false
      OnSelect: |-
        =Set(
            gGame,
            Patch(
                BottleGames,
                LookUp(BottleGames, ID = locJoin.ID),
                {Status: "PLAYING", GuestName: User().FullName, GuestEmail: User().Email}
            )
        );
        Set(gP1, {Name: gGame.HostName, Email: gGame.HostEmail});
        Set(gP2, {Name: gGame.GuestName, Email: gGame.GuestEmail});
        Set(gTeam, gGame.TeamName);
        Navigate(scrGame, ScreenTransition.Fade)
      X: =0
      Y: =0
      Width: =10
      Height: =10
