- btnBackLobby:
    Control: Classic/Button
    Properties:
      Text: =If(gMySeat = 1, "◀ CANCEL ROOM", "◀ BACK")
      OnSelect: |-
        =If(
            gMySeat = 1 && !IsBlank(gGame) && gGame.Status = "WAITING",
            Patch(BottleGames, LookUp(BottleGames, ID = gGame.ID), {Status: "CANCELLED"})
        );
        Navigate(scrTeam, ScreenTransition.Fade)
      Font: =Font.'Courier New'
      FontWeight: =FontWeight.Bold
      Size: =18
      Fill: =C_Black
      Color: =C_White
      HoverFill: =C_Navy
      HoverColor: =C_White
      PressedFill: =C_Blue
      PressedColor: =C_White
      BorderColor: =C_Blue
      BorderThickness: =4
      RadiusTopLeft: =0
      RadiusTopRight: =0
      RadiusBottomLeft: =0
      RadiusBottomRight: =0
      X: =72
      Y: =630
      Width: =300
      Height: =76
- tmrLobby:
    Control: Timer
    Properties:
      Duration: =2000
      Repeat: =true
      AutoStart: =true
      Visible: =false
      OnTimerEnd: |-
        =Refresh(BottleGames);
        If(
            gMySeat = 1,
                Set(gGame, LookUp(BottleGames, ID = gGame.ID));
                If(
                    gGame.Status = "PLAYING",
                    Set(gP2, {Name: gGame.GuestName, Email: gGame.GuestEmail});
                    Navigate(scrGame, ScreenTransition.Fade)
                ),
            Set(
                gInvite,
                First(
                    Sort(
                        Filter(BottleGames, GuestEmail = User().Email && Status = "WAITING"),
                        ID,
                        SortOrder.Descending
                    )
                )
            )
        )
      X: =1200
      Y: =700
      Width: =40
      Height: =20
